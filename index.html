<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HalalAI - كاشف المنتجات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: white; font-family: system-ui; }
        .camera-box { position: relative; border-radius: 24px; overflow: hidden; background: #111; border: 2px solid #222; }
        .scan-line { position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: #10b981; box-shadow: 0 0 15px #10b981; animation: scan 2s linear infinite; display: none; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .result-card { background: #111; border: 1px solid #333; border-radius: 20px; display: none; }
    </style>
</head>
<body class="p-4 flex flex-col min-h-screen">
    <header class="text-center py-6">
        <h1 class="text-3xl font-bold text-emerald-500">HalalAI</h1>
        <p class="text-gray-400 text-sm mt-1">امسح أي منتج لتعرف حقيقته فوراً</p>
    </header>

    <main class="flex-1 max-w-md mx-auto w-full space-y-6">
        <div class="camera-box aspect-[3/4] flex items-center justify-center">
            <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
            <canvas id="canvas" class="hidden"></canvas>
            <div id="scanLine" class="scan-line"></div>
            
            <div id="captureUI" class="absolute bottom-6 w-full px-6 flex justify-center">
                <button onclick="captureImage()" class="bg-emerald-500 text-white w-16 h-16 rounded-full border-4 border-white/20 flex items-center justify-center shadow-lg active:scale-90 transition-all">
                    📸
                </button>
            </div>
        </div>

        <div id="resultArea" class="result-card p-6 space-y-4">
            <div class="flex items-center gap-3">
                <div id="statusBadge" class="px-4 py-1 rounded-full text-sm font-bold bg-gray-800">جاري التحليل...</div>
            </div>
            <div id="aiResponse" class="text-gray-300 leading-relaxed text-sm">
                </div>
            <button onclick="restartCamera()" class="w-full py-3 bg-gray-800 rounded-xl text-sm font-medium">مسح منتج آخر</button>
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const scanLine = document.getElementById('scanLine');
        const resultArea = document.getElementById('resultArea');
        const aiResponse = document.getElementById('aiResponse');
        const statusBadge = document.getElementById('statusBadge');

        // تشغيل الكاميرا فور فتح التطبيق
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert("يرجى السماح بالوصول للكاميرا ليعمل التطبيق");
            }
        }

        async function captureImage() {
            // تصوير المشهد
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // تفعيل واجهة التحليل
            scanLine.style.display = 'block';
            document.getElementById('captureUI').style.display = 'none';

            // محاكاة إرسال البيانات لي (Gemini) والرد عليك
            // ملاحظة: هنا سنضع رداً ذكياً افتراضياً، وفي الخطوة القادمة سأعلمك كيف تضع الـ API Key الخاص بك للرد الفعلي
            setTimeout(() => {
                showResult();
            }, 3000);
        }

        function showResult() {
            scanLine.style.display = 'none';
            resultArea.style.display = 'block';
            video.parentElement.style.display = 'none';

            statusBadge.innerText = "حلال ✅";
            statusBadge.className = "px-4 py-1 rounded-full text-sm font-bold bg-emerald-500/20 text-emerald-500";
            
            aiResponse.innerHTML = `
                <h3 class="font-bold text-white mb-2">تحليل المنتج:</h3>
                <p>هذا المنتج لا يحتوي على دهون خنزير أو كحول. المكونات آمنة وفقاً للمعايير الصحية.</p>
                <div class="mt-4 pt-4 border-t border-gray-800">
                    <p class="text-sky-400 font-medium">الفوائد:</p>
                    <ul class="list-disc list-inside text-gray-400 text-xs mt-1">
                        <li>غني بالألياف الطبيعية</li>
                        <li>لا يحتوي على مواد حافظة ضارة</li>
                    </ul>
                </div>
                <div class="mt-2 text-xs text-gray-500 italic">التطبيق يتحدث تلقائياً مع تطورات Gemini AI</div>
            `;
        }

        function restartCamera() {
            location.reload();
        }

        initCamera();
    </script>
</body>
</html>
